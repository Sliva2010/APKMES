name: noctis_app
description: "NOCTIS — премиальный кроссплатформенный мессенджер в чёрно-белой эстетике."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Состояние и навигация
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Платформенные API
  vibration: ^2.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  flutter_local_notifications: ^17.2.3
  audioplayers: ^6.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Утилиты
  intl: ^0.19.0
  collection: ^1.18.0
  qr: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
